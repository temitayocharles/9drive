name: Backend security and build

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-security.yml"

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: mysql://user:pass@127.0.0.1:3306/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma generate
      - run: npm run build
